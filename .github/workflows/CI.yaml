name: "Continuous Integration"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  client-app-tests:
    name: "client App Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codeBase/client
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./codeBase/client/package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck


  server-test:
    name: "server Tests"
    runs-on: ubuntu-latest
    needs: client-app-tests
    defaults:
      run:
        working-directory: ./codeBase/server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./codeBase/server/package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

  Admin-app-tests:
    name: "Admin App Tests"
    runs-on: ubuntu-latest
    needs: server-test
    defaults:
      run:
        working-directory: ./codeBase/admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./codeBase/admin/package-lock.json
      - name: Install dependencies
        run: npm install

