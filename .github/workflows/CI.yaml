name: "Continuous Integration"

on: 
  push:
    branches:
      - main
  
  pull_request:
     branches:
       - main

jobs:
  client-app-tests:
    name: "client App Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codeBase/server
    
    steps:
      - uses: actions/checkout@v7
      - name: "setup node"
        uses: actions/setup-node@v3
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./codeBase/client/package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build
    

  client:
    name: "client"
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codeBase/client
    
    steps:
      - uses: actions/checkout@v7
      - name: "setup node"
        uses: actions/setup-node@v3
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./codeBase/server/package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build
      
  admin:
    name: "admin"
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./codeBase/admin
      
    steps:
      - uses: actions/checkout@v7
      - name: "setup node"
        uses: actions/setup-node@v3
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./codeBase/admin/package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build
